apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-java-gitops
  labels:
    app.kubernetes.io/name: java-api
    app.kubernetes.io/part-of: gitops-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: java-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: java-api
        app.kubernetes.io/part-of: gitops-lab
    spec:
      containers:
        - name: java-api
          image: gitops-lab/java-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: java-api-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
